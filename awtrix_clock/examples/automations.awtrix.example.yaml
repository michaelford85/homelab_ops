- id: '1780169374872'
  alias: Awtrix Office Pihole Blocked
  description: ''
  triggers:
  - trigger: time_pattern
    minutes: /5
  actions:
  - variables:
      ph1: '{{ states(''sensor.pi_hole_ads_blocked'') | int(0) }}'
      ph2: '{{ states(''sensor.pi_hole2_ads_blocked'') | int(0) }}'
  - action: mqtt.publish
    data:
      topic: awtrix/office/custom/pihole
      payload: "{\"icon\":\"7820\",\n \"text\":[\n   {\"t\":\"{{ ph1 }}\",\"c\":\"#FFAA00\"},\n
        \  {\"t\":\"/\",\"c\":\"#FFFFFF\"},\n   {\"t\":\"{{ ph2 }}\",\"c\":\"#FFAA00\"}\n
        ],\n \"duration\":8,\n\"scrollSpeed\":50}"
  mode: single

- id: '1780170986634'
  alias: Awtrix Office Bright on Presence
  description: ''
  triggers:
  - trigger: state
    entity_id: binary_sensor.office_mmwave
    to: 'on'
  actions:
  - action: mqtt.publish
    data:
      topic: awtrix/office/settings
      payload: '{"BRI":100,"ABRI":false}'
  mode: single

- id: '1780171077395'
  alias: Awtrix Office Dim on Absence
  description: ''
  triggers:
  - trigger: state
    entity_id: binary_sensor.office_mmwave
    to: 'off'
    for:
      minutes: 2
  actions:
  - action: mqtt.publish
    data:
      topic: awtrix/office/settings
      payload: '{"BRI":10,"ABRI":false}'
  mode: single

- id: '1780171943697'
  alias: Awtrix Office Stocks
  description: ''
  triggers:
  - trigger: time_pattern
    minutes: /5
  actions:
  - variables:
      mdb_price: '{{ states(''sensor.yahoofinance_mdb'') | float(0) | round(2) }}'
      mdb_chg: '{{ state_attr(''sensor.yahoofinance_mdb'',''regularMarketChangePercent'')
        | float(0) | round(1) }}'
      spx_price: '{{ states(''sensor.yahoofinance_gspc'') | float(0) | round(0) |
        int }}'
      spx_chg: '{{ state_attr(''sensor.yahoofinance_gspc'',''regularMarketChangePercent'')
        | float(0) | round(1) }}'
      dji_price: '{{ states(''sensor.yahoofinance_dji'') | float(0) | round(0) | int
        }}'
      dji_chg: '{{ state_attr(''sensor.yahoofinance_dji'',''regularMarketChangePercent'')
        | float(0) | round(1) }}'
      mdb_color: '{{ ''#00FF00'' if mdb_chg >= 0 else ''#FF0000'' }}'
      spx_color: '{{ ''#00FF00'' if spx_chg >= 0 else ''#FF0000'' }}'
      dji_color: '{{ ''#00FF00'' if dji_chg >= 0 else ''#FF0000'' }}'
  - action: mqtt.publish
    data:
      topic: awtrix/office/custom/stocks
      payload: "{\"text\":[\n  {\"t\":\"S&P 500 \",\"c\":\"#FFFFFF\"},\n  {\"t\":\"{{
        spx_price }} ({{ spx_chg }}%) \",\"c\":\"{{ spx_color }}\"},\n  {\"t\":\"DJI
        \",\"c\":\"#FFFFFF\"},\n  {\"t\":\"{{ dji_price }} ({{ dji_chg }}%)\",\"c\":\"{{
        dji_color }}\"},\n  {\"t\":\" MDB \",\"c\":\"#FFFFFF\"},\n  {\"t\":\"{{ mdb_price
        }} ({{ mdb_chg }}%) \",\"c\":\"{{ mdb_color }}\"}\n ],\n \"duration\":13,\n
        \"scrollSpeed\":70}\n"
  mode: single
