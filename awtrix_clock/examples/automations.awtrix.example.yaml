# ============================================================================
# AWTRIX automations - fully templated example (three-clock setup)
# ============================================================================
#
# Copy these blocks into Home Assistant's automations.yaml and replace every
# placeholder below with the value for your environment.
#
# ---------------------------------------------------------------------------
# Per-room MQTT prefix (set once on each clock via its web UI -> MQTT).
# Each physical clock MUST have a unique two-level prefix:
#   awtrix/kitchen      kitchen unit
#   awtrix/livingroom   living room unit
#   awtrix/office       office unit
# ---------------------------------------------------------------------------
# Placeholder        Example value   Where it lives
#   <user_a_device>  phone_a         HA mobile_app integration (timer recipient A)
#   <user_b_device>  phone_b         HA mobile_app integration (timer recipient B)
# ---------------------------------------------------------------------------
#
# Entities that depend on your own integrations (rename to match yours):
#   weather.forecast_home / weather.openweathermap   weather provider
#   timer.kitchen_clock                  (../homeassistant/configuration.snippet.yaml)
#   input_select.kitchen_timer_notify    (../homeassistant/helpers.md)
#   binary_sensor.office_mmwave          office presence sensor
#   sensor.pi_hole_ads_blocked / sensor.pi_hole2_ads_blocked
#   sensor.yahoofinance_mdb / _gspc / _dji
#
# To add a fourth clock, pick a new unique prefix (e.g. awtrix/bedroom) and
# duplicate the relevant blocks. See ../README.md for the full walkthrough.
# ============================================================================

- id: awtrix_weather
  alias: Awtrix Weather
  triggers:
  - entity_id: weather.forecast_home
    trigger: state
  - minutes: /2
    trigger: time_pattern
  actions:
  - action: weather.get_forecasts
    target:
      entity_id: weather.forecast_home
    data:
      type: daily
    response_variable: fc
  - variables:
      today: '{{ fc[''weather.forecast_home''].forecast[0] }}'
      cur: '{{ states(''weather.forecast_home'') }}'
      temp: '{{ state_attr(''weather.forecast_home'',''temperature'') | round(0) }}'
      hum: '{{ state_attr(''weather.forecast_home'',''humidity'') }}'
      hi: '{{ today.temperature | round(0) }}'
      lo: '{{ today.templow | round(0) }}'
      label: '{% set m = {''sunny'':''Sunny'',''clear-night'':''Clear'',''partlycloudy'':''Partly
        Cloudy'', ''cloudy'':''Cloudy'',''rainy'':''Rain'',''pouring'':''Heavy Rain'',''snowy'':''Snow'',
        ''fog'':''Fog'',''windy'':''Windy'',''lightning'':''Storm'',''lightning-rainy'':''Storm''}
        %} {{ m.get(cur, cur | title) }}

        '
      icon: '{% set i = {''sunny'':11201,''clear-night'':12181,''partlycloudy'':53802,
        ''cloudy'':53802,''rainy'':2284,''pouring'':2284,''snowy'':2289,''fog'':17055}
        %} {{ i.get(cur, 2282) }}

        '
  - action: mqtt.publish
    data:
      topic: awtrix/kitchen/custom/weather
      payload: "{\"icon\": {{ icon }},\n \"text\": \"{{ label }} {{ temp }}° H{{ hi
        }}° L{{ lo }}° {{ hum }}%\",\n \"duration\": 9}\n"
  mode: single

- id: awtrix_timer_display
  alias: Awtrix Timer Display
  triggers:
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.kitchen_clock
  - trigger: state
    entity_id: timer.kitchen_clock
    to: active
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.event is defined and trigger.event.event_type
          == ''timer.finished'' }}'
      sequence:
      - data:
          topic: awtrix/kitchen/notify
          payload: '{"text":"TIME!","icon":2421,"color":[255,0,0],"duration":30,"sound":"alarm"}'
        action: mqtt.publish
      - data:
          topic: awtrix/kitchen/custom/timer
          payload: ''
        action: mqtt.publish
      - choose:
        - conditions:
          - condition: state
            entity_id: input_select.kitchen_timer_notify
            state: User A
          sequence:
          - data:
              title: Kitchen Timer
              message: Your timer is done!
            action: notify.mobile_app_<user_a_device>
        - conditions:
          - condition: state
            entity_id: input_select.kitchen_timer_notify
            state: User B
          sequence:
          - data:
              title: Kitchen Timer
              message: Your timer is done!
            action: notify.mobile_app_<user_b_device>
        default:
        - data:
            title: Kitchen Timer
            message: Your timer is done!
          action: notify.mobile_app_<user_a_device>
        - data:
            title: Kitchen Timer
            message: Your timer is done!
          action: notify.mobile_app_<user_b_device>
    default:
    - repeat:
        while:
        - condition: state
          entity_id: timer.kitchen_clock
          state: active
        sequence:
        - data:
            topic: awtrix/kitchen/custom/timer
            payload: '{% set f = state_attr(''timer.kitchen_clock'',''finishes_at'')
              %} {% set rem = (as_datetime(f) - now()).total_seconds() | int %} {"icon":
              2421, "text": "{{ ''%d:%02d'' % (rem // 60, rem % 60) }}"}

              '
          action: mqtt.publish
        - delay: 00:00:03
  mode: restart

- id: '1779803181146'
  alias: Awtrix Clock Faces
  description: ''
  triggers:
  - trigger: time_pattern
    seconds: /10
  actions:
  - data:
      topic: awtrix/kitchen/custom/clock
      payload: '{"text": "{{ now().strftime(''%-I:%M %p'') }}", "duration": 20}

        '
    action: mqtt.publish
  - data:
      topic: awtrix/kitchen/custom/date
      payload: '{"text": "{{ now().strftime(''%m/%d'') }}", "duration": 5}

        '
    action: mqtt.publish
  mode: single

- id: '1780071796632'
  alias: Refresh OWM Weather Every 15 Minutes
  description: ''
  triggers:
  - trigger: time_pattern
    minutes: /15
  actions:
  - action: homeassistant.update_entity
    target:
      entity_id: weather.openweathermap

- id: '1780166876884'
  alias: Awtrix Time Weather Combined
  triggers:
  - trigger: state
    entity_id: weather.openweathermap
  - trigger: time_pattern
    seconds: /10
  actions:
  - action: weather.get_forecasts
    target:
      entity_id: weather.openweathermap
    data:
      type: daily
    response_variable: fc
  - variables:
      temp: '{{ state_attr(''weather.openweathermap'',''temperature'') | round(0)
        }}'
      hour12: '{{ now().strftime(''%-I'') }}'
      mins: '{{ now().strftime(''%M'') }}'
      is_am: '{{ now().hour < 12 }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_am }}'
      sequence:
      - action: mqtt.publish
        data:
          topic: awtrix/livingroom/indicator1
          payload: '{"color":"#FFFFFF"}'
      - action: mqtt.publish
        data:
          topic: awtrix/livingroom/indicator3
          payload: ''
    - conditions:
      - condition: template
        value_template: '{{ not is_am }}'
      sequence:
      - action: mqtt.publish
        data:
          topic: awtrix/livingroom/indicator1
          payload: ''
      - action: mqtt.publish
        data:
          topic: awtrix/livingroom/indicator3
          payload: '{"color":"#FFFFFF"}'
  - action: mqtt.publish
    data:
      topic: awtrix/livingroom/custom/clockweather
      payload: "{\"text\": \"{{ hour12 }}:{{ mins }} {{ temp }}F\",\n \"duration\":
        15}\n"
  mode: single

